name: Ruff Lint and Format

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        python -m pip install --no-cache-dir uv
    - name: Setup uv
      run: |
        uv python pin 3.14
        uv add --dev ruff
        uv lock --upgrade-package ruff
    - name: Lint with Ruff
      run: |
        uv run ruff check --output-format github --config ruff.toml
    - name: Check format with Ruff
      run: |
        uv run ruff format --diff --config ruff.toml
